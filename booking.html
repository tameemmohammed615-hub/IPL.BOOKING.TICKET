<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL Ticket Booking</title>
    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6fb;
        color: #0f172a;
        margin: 0;
        padding: 24px;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
      }

      .match-list,
      .form-box {
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-bottom: 24px;
      }

      .match-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #e2e8f0;
      }

      .match-item:last-child {
        border-bottom: none;
      }

      .book-btn {
        padding: 9px 16px;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
      }

      .form-group {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }

      input,
      select {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        box-sizing: border-box;
      }

      button[type="submit"] {
        padding: 10px 18px;
        background-color: #1d4ed8;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="match-list">
        <h2>Matches</h2>
        <div class="match-item">
          <span>RCB vs CSK</span>
          <button type="button" class="book-btn">Book</button>
        </div>
        <div class="match-item">
          <span>MI vs KKR</span>
          <button type="button" class="book-btn">Book</button>
        </div>
      </div>

      <div class="form-box">
        <h1>IPL Ticket Booking Form</h1>
        <form id="bookingForm">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="match">Match</label>
            <select id="match" name="match" required>
              <option value="">-- Select Match --</option>
              <option value="RCB vs CSK">RCB vs CSK</option>
              <option value="MI vs KKR">MI vs KKR</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tickets">Tickets</label>
            <input
              type="number"
              id="tickets"
              name="tickets"
              min="1"
              max="10"
              value="1"
              required
            />
          </div>

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
